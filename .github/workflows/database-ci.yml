name: Database CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Local database and harness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head or push commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: Verify local database, negative gates and cleanup
        run: npm run test:db:harness

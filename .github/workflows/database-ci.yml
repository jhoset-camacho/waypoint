name: Database CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read # Read-only GHCR authentication; no package writes.

concurrency:
  group: database-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Local database and harness
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head or push commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node 24)
        with:
          node-version: 22
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3; Node 20 warning remains upstream
        with:
          version: 2.106.0
      - name: Authenticate image pulls to GHCR
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/wp-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set +x
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Verify local database, negative gates and cleanup
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/wp-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:db:harness
      - name: Remove ephemeral registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/wp-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf -- "$DOCKER_CONFIG"
